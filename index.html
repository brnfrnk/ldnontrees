<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London, Ontario Trees</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>London, Ontario City Trees</h1>
            <p class="subtitle">Exploring the urban forest canopy</p>
        </header>

        <div class="loading-section" id="loadingSection">
            <div class="loading-indicator">
                <div class="spinner"></div>
                <p id="loadingStatus">Loading tree data...</p>
            </div>
        </div>

        <div class="content-grid">
            <div class="species-list-section">
                <h2>Tree Species</h2>
                <div id="speciesList" class="species-list">
                    <p class="placeholder">Loading data...</p>
                </div>
            </div>

            <div class="chart-section">
                <h2>Species Distribution</h2>
                <div class="chart-container">
                    <canvas id="speciesChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
